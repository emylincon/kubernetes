# https://taskfile.dev

version: "3"

vars:
  DOCKER_IMAGE: ugwuanyi/custom-configmap-controller
  DOCKER_TAG: 0.0.2

tasks:
  build_push:
    cmds:
      - docker buildx ls | grep "temp_builder" || docker buildx create --name=temp_builder --platform linux/amd64,linux/arm64
      - docker buildx use temp_builder
      - docker buildx build --platform linux/amd64,linux/arm64 -t {{.DOCKER_IMAGE}}:{{.DOCKER_TAG}} -t {{.DOCKER_IMAGE}}:latest --push .
    silent: true
  build_local:
    cmds:
      - docker build -t {{.DOCKER_IMAGE}} .
    silent: true
  run:
    cmds:
      - docker run -it {{.DOCKER_IMAGE}}
    silent: true
  run_local:
    cmds:
      - python3 main.py
    silent: true
