# all input will come from filebeat, no local logs
input {
  file {
    path => "/var/log/app/*.log"
  }
}

filter {
   json {
    source => "message"
  }
  translate {
    source => "[statusCode]"
    target => "[emekaStatusCode]"
    dictionary => { 
      "200" => "OK" 
      "201" => "OK_1" 
      "300" => "redirect" 
      "400" => "client_error" 
      "500" => "server_error"
    }
    fallback => "fallback"
  }
  ruby {
    path => "/emeka/etc/logstash/mutate.rb"
    script_params => { "check_variables" => ["sec", "bytes", "size", "contentlen"] }
  }

}

 

output {
    elasticsearch {
        hosts => [ "http://elasticsearch:9200" ]
        index => "emekalogindex"
    }
}
