# all input will come from filebeat, no local logs
input {
  file {
    path => "/var/log/app/*.log"
  }
}

filter {
   json {
    source => "message"
  }
  ruby {
    code => '
      event.to_hash.each do |key, value|
          if "#{key}".downcase.end_with?("sec", "bytes", "size", "contentlen") and (value == "-")
              event.set(key, 0)
          end
      end
    '
  }

}

 

output {
    elasticsearch {
        hosts => [ "http://elasticsearch:9200" ]
        index => "emekalogindex"
    }
}
